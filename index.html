<!DOCTYPE html>
<html lang="zh-Hant" data-theme="cream" data-font="normal">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>旅程手帳 · Tour Planner</title>
  <meta name="description" content="旅遊行程規劃工具：以時間軸編排每日景點、交通與停留時間。" />

  <!-- 字體：編輯感標題(Newsreader/Noto Serif TC) + 工具內文(Noto Sans TC) + 時間(IBM Plex Mono) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..500&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500;600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
</head>
<body>
  <div id="app" aria-live="polite">
    <!-- render() 會以 innerHTML 完整重繪此容器 -->
    <div class="boot">載入中…</div>
  </div>

  <!-- 分類選色 / 對話框 / 雲端共用面板的掛載點 -->
  <div id="overlay-root"></div>

  <!-- Firebase compat SDK（雲端共用；classic script 於 module 前同步載入 window.firebase） -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

  <script type="module" src="./js/app.js"></script>
  <noscript>
    <p style="padding:2rem;text-align:center;font-family:sans-serif">
      本工具需要啟用 JavaScript 才能使用。
    </p>
  </noscript>
</body>
</html>
